<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yerin Görsənir - Namiq Qasımov</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .spotify-container {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(180deg, #424242 0%, #121212 100%);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none; /* Firefox için gizle */
        }
        
        .spotify-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari için gizle */
        }

        .top-bar {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #b3b3b3;
            margin-bottom: 30px;
        }

        .album-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #282828;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
            background-image: url('cover.jpg'); /* Klasördeki cover.jpg dosyasını çeker, yoksa gri durur */
            background-size: cover;
            background-position: center;
        }

        .song-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .song-info h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .song-info h2 {
            font-size: 1rem;
            font-weight: 500;
            color: #b3b3b3;
        }

        .like-icon {
            color: #1db954;
            font-size: 1.5rem;
        }

        audio {
            width: 100%;
            margin-bottom: 30px;
            border-radius: 50px;
            height: 40px;
        }

        /* Spotify Şarkı Sözleri Kutusu Tasarımı */
        .lyrics-card {
            background-color: #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 350px;
        }

        .lyrics-header {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .lyrics-scroll-area {
            height: 250px;
            overflow-y: auto;
            position: relative;
            padding-bottom: 150px; /* Kaydırma boşluğu */
            scroll-behavior: smooth;
            scrollbar-width: none;
        }
        
        .lyrics-scroll-area::-webkit-scrollbar {
            display: none;
        }

        .lyric-line {
            font-size: 1.5rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4); /* Aktif olmayan sözler soluk */
            margin-bottom: 15px;
            line-height: 1.4;
            transition: color 0.3s ease;
            text-align: left;
        }

        .lyric-line.active {
            color: #ffffff; /* Aktif olan söz parlak beyaz */
        }

    </style>
</head>
<body>

    <div class="spotify-container">
        
        <div class="top-bar">
            Şu an Çalınan
        </div>

        <div class="album-cover"></div>

        <div class="song-details">
            <div class="song-info">
                <h1>Yerin Görsənir</h1>
                <h2>Namiq Qasımov</h2>
            </div>
            <div class="like-icon">♥</div>
        </div>

        <audio id="audioPlayer" controls>
            <source src="sarki.mp3" type="audio/mpeg">
        </audio>

        <div class="lyrics-card">
            <div class="lyrics-header">Sözler</div>
            <div class="lyrics-scroll-area" id="lyricsScrollArea">
                <div id="lyricsWrapper">
                    </div>
            </div>
        </div>

    </div>

    <script>
        const lyricsData = [
            { time: 0, text: "♪ (Müzik)" },
            { time: 24, text: "Bu gecə sərxoşam" },
            { time: 27, text: "Düşünürəm səni" },
            { time: 30, text: "Sənə vurulmuşam" },
            { time: 33, text: "Qınama sən məni" },
            { time: 36, text: "Belə olur sevəndə adam kövrəlir" },
            { time: 40, text: "Qarışır hisslər, dumanlar gəlir" },
            { time: 44, text: "Durmadan sənin sağlığına tək içirəm" },
            { time: 50, text: "Yerin görsənir" },
            { time: 53, text: "Ürəyim istədi" },
            { time: 56, text: "Bəlkə gələsən yanıma" },
            { time: 60, text: "Yerin görsənir" },
            { time: 63, text: "Heç kəsi dinləmədən" },
            { time: 66, text: "Gəl görüşək gizlicə" },
            { time: 69, text: "Dünyanın ən dəli sərxoşu kimi" },
            { time: 73, text: "Süzüm nəfəsini" },
            { time: 75, text: "İçim bu gecə" },
            { time: 78, text: "Heç kəsi dinləmədən" },
            { time: 81, text: "Gəl görüşək gizlicə" },
            { time: 84, text: "Dünyanın ən dəli sərxoşu kimi" },
            { time: 88, text: "Süzüm nəfəsini" },
            { time: 90, text: "İçim bu gecə" },
            { time: 94, text: "♪ (Müzik)" },
            { time: 122, text: "Belə olur sevəndə adam kövrəlir" },
            { time: 126, text: "Qarışır hisslər, dumanlar gəlir" },
            { time: 130, text: "Durmadan sənin sağlığına tək içirəm" },
            { time: 136, text: "Yerin görsənir" },
            { time: 139, text: "Ürəyim istədi" },
            { time: 142, text: "Bəlkə gələsən yanıma" },
            { time: 146, text: "Yerin görsənir" },
            { time: 149, text: "Heç kəsi dinləmədən" },
            { time: 152, text: "Gəl görüşək gizlicə" },
            { time: 155, text: "Dünyanın ən dəli sərxoşu kimi" },
            { time: 159, text: "Süzüm nəfəsini" },
            { time: 161, text: "İçim bu gecə" },
            { time: 164, text: "Heç kəsi dinləmədən" },
            { time: 167, text: "Gəl görüşək gizlicə" },
            { time: 171, text: "Dünyanın ən dəli sərxoşu kimi" },
            { time: 174, text: "Süzüm nəfəsini" },
            { time: 177, text: "İçim bu gecə" },
            { time: 182, text: "♪ (Müzik bitişi)" }
        ];

        const audio = document.getElementById('audioPlayer');
        const lyricsWrapper = document.getElementById('lyricsWrapper');
        const scrollArea = document.getElementById('lyricsScrollArea');
        let currentLineIndex = -1;

        lyricsData.forEach((line, index) => {
            const div = document.createElement('div');
            div.className = 'lyric-line';
            div.id = `line-${index}`;
            div.innerText = line.text;
            lyricsWrapper.appendChild(div);
        });

        audio.addEventListener('timeupdate', () => {
            const currentTime = audio.currentTime;
            
            let activeIndex = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            if (activeIndex !== currentLineIndex && activeIndex !== -1) {
                if (currentLineIndex !== -1) {
                    const prevLine = document.getElementById(`line-${currentLineIndex}`);
                    if(prevLine) prevLine.classList.remove('active');
                }
                
                const currentLine = document.getElementById(`line-${activeIndex}`);
                if(currentLine) {
                    currentLine.classList.add('active');
                    
                    // Aktif sözü kutunun ortasına otomatik kaydırır
                    const scrollPosition = currentLine.offsetTop - (scrollArea.clientHeight / 2) + (currentLine.clientHeight / 2);
                    scrollArea.scrollTo({
                        top: scrollPosition,
                        behavior: 'smooth'
                    });
                }
                currentLineIndex = activeIndex;
            }
        });
    </script>
</body>
</html>
