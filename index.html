<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yerin Görsənir - Namiq Qasımov</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-wrapper {
            display: flex;
            flex-direction: row;
            gap: 40px;
            width: 100%;
            max-width: 900px;
            background: linear-gradient(180deg, #2a2a2a 0%, #121212 100%);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
        }

        .player-section {
            width: 350px;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #b3b3b3;
            margin-bottom: 20px;
        }

        .album-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #282828;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
            background-image: url('cover.jpg'); 
            background-size: cover;
            background-position: center;
        }

        .song-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .song-info h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .song-info h2 {
            font-size: 1rem;
            font-weight: 500;
            color: #b3b3b3;
        }

        .like-icon {
            color: #1db954;
            font-size: 1.5rem;
            cursor: pointer;
        }

        audio {
            width: 100%;
            border-radius: 50px;
            height: 40px;
            outline: none;
        }

        .lyrics-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: rgba(40, 40, 40, 0.4); 
            border-radius: 12px;
            padding: 25px;
            height: 500px;
        }

        .lyrics-header {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ffffff;
            flex-shrink: 0;
        }

        .lyrics-scroll-area {
            flex: 1;
            overflow-y: auto;
            position: relative;
            scroll-behavior: smooth;
            scrollbar-width: none; 
            padding-top: 200px; 
            padding-bottom: 200px;
        }
        
        .lyrics-scroll-area::-webkit-scrollbar {
            display: none; 
        }

        .lyric-line {
            font-size: 1.4rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.3); 
            margin-bottom: 20px;
            line-height: 1.4;
            transition: all 0.4s ease;
            text-align: left;
            cursor: default;
        }

        .lyric-line.active {
            color: #ffffff;
            font-size: 1.8rem; 
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .main-wrapper {
                flex-direction: column;
                align-items: center;
                padding: 20px;
            }
            .player-section, .lyrics-section {
                width: 100%;
                max-width: 350px;
            }
            .lyrics-section {
                height: 400px;
            }
            .lyrics-scroll-area {
                padding-top: 150px;
                padding-bottom: 150px;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="player-section">
            <div class="top-bar">Şu an Çalınan</div>
            <div class="album-cover"></div>
            
            <div class="song-details">
                <div class="song-info">
                    <h1>Yerin Görsənir</h1>
                    <h2>Namiq Qasımov</h2>
                </div>
                <div class="like-icon">♥</div>
            </div>

            <audio id="audioPlayer" controls>
                <source src="sarki.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="lyrics-section">
            <div class="lyrics-header">Sözler</div>
            <div class="lyrics-scroll-area" id="lyricsScrollArea">
                <div id="lyricsWrapper">
                </div>
            </div>
        </div>
    </div>

    <script>
        // SÖZLERİN 1 SANİYE ERKEN GELMESİ İÇİN AYAR
        // Daha da erken gelmesini istersen bu sayıyı büyüt (örneğin 1.5 veya 2)
        const zamanKaymasi = 2; 

        const lyricsData = [
            { time: 0, text: "♪ (Müzik)" },
            { time: 19.5, text: "Bu gecə sərxoşam" },
            { time: 23.0, text: "Düşünürəm səni" },
            { time: 26.5, text: "Sənə vurulmuşam" },
            { time: 29.5, text: "Qınama sən məni" },
            { time: 33.0, text: "Belə olur sevəndə adam kövrəlir" },
            { time: 36.5, text: "Qarışır hisslər, dumanlar gəlir" },
            { time: 40.0, text: "Durmadan sənin sağlığına tək içirəm" },
            { time: 46.5, text: "Yerin görsənir" },
            { time: 50.0, text: "Ürəyim istədi" },
            { time: 53.0, text: "Bəlkə gələsən yanıma" },
            { time: 56.5, text: "Yerin görsənir" },
            { time: 60.0, text: "Heç kəsi dinləmədən" },
            { time: 63.5, text: "Gəl görüşək gizlicə" },
            { time: 66.5, text: "Dünyanın ən dəli sərxoşu kimi" },
            { time: 70.0, text: "Süzüm nəfəsini" },
            { time: 72.0, text: "İçim bu gecə" },
            { time: 74.0, text: "Heç kəsi dinləmədən" },
            { time: 77.0, text: "Gəl görüşək gizlicə" },
            { time: 80.0, text: "Dünyanın ən dəli sərxoşu kimi" },
            { time: 83.5, text: "Süzüm nəfəsini" },
            { time: 85.5, text: "İçim bu gecə" },
            { time: 89.0, text: "♪ (Müzik)" },
            { time: 115.0, text: "Belə olur sevəndə adam kövrəlir" },
            { time: 119.0, text: "Qarışır hisslər, dumanlar gəlir" },
            { time: 122.5, text: "Durmadan sənin sağlığına tək içirəm" },
            { time: 129.0, text: "Yerin görsənir" },
            { time: 132.5, text: "Ürəyim istədi" },
            { time: 135.5, text: "Bəlkə gələsən yanıma" },
            { time: 139.0, text: "Yerin görsənir" },
            { time: 142.5, text: "Heç kəsi dinləmədən" },
            { time: 146.0, text: "Gəl görüşək gizlicə" },
            { time: 149.0, text: "Dünyanın ən dəli sərxoşu kimi" },
            { time: 152.5, text: "Süzüm nəfəsini" },
            { time: 154.5, text: "İçim bu gecə" },
            { time: 156.5, text: "Heç kəsi dinləmədən" },
            { time: 159.5, text: "Gəl görüşək gizlicə" },
            { time: 162.5, text: "Dünyanın ən dəli sərxoşu kimi" },
            { time: 166.0, text: "Süzüm nəfəsini" },
            { time: 168.0, text: "İçim bu gecə" },
            { time: 173.0, text: "♪ (Müzik bitişi)" }
        ];

        const audio = document.getElementById('audioPlayer');
        const lyricsWrapper = document.getElementById('lyricsWrapper');
        let currentLineIndex = -1;

        lyricsData.forEach((line, index) => {
            const div = document.createElement('div');
            div.className = 'lyric-line';
            div.id = `line-${index}`;
            div.innerText = line.text;
            lyricsWrapper.appendChild(div);
        });

        audio.addEventListener('timeupdate', () => {
            // Zaman kaymasını şarkının anki süresine ekliyoruz
            const adjustedTime = audio.currentTime + zamanKaymasi;
            
            let activeIndex = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (adjustedTime >= lyricsData[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            if (activeIndex !== currentLineIndex && activeIndex !== -1) {
                if (currentLineIndex !== -1) {
                    const prevLine = document.getElementById(`line-${currentLineIndex}`);
                    if(prevLine) prevLine.classList.remove('active');
                }
                
                const currentLine = document.getElementById(`line-${activeIndex}`);
                if(currentLine) {
                    currentLine.classList.add('active');
                    
                    currentLine.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    });
                }
                currentLineIndex = activeIndex;
            }
        });
    </script>
</body>
</html>
