<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yerin Görsənir - Namiq Qasımov</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .header-text {
            position: absolute;
            top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #1db954; /* Spotify yeşili tonunda */
            text-align: center;
            width: 100%;
            letter-spacing: 1px;
        }
        .album-art {
            width: 250px;
            height: 250px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            margin-bottom: 20px;
            background-color: #282828;
            /* Resim eklemek istersen alttaki yorumu kaldır ve resim adını gir */
            /* background-image: url('cover.jpg'); */
            background-size: cover;
            background-position: center;
        }
        .song-info {
            text-align: center;
            margin-bottom: 20px;
        }
        .song-title {
            font-size: 2rem;
            margin: 0;
            font-weight: 700;
        }
        .artist-name {
            font-size: 1.2rem;
            color: #b3b3b3;
            margin: 5px 0 0 0;
        }
        .lyrics-container {
            height: 180px;
            overflow: hidden;
            position: relative;
            width: 90%;
            max-width: 600px;
            text-align: center;
            /* Üstten ve alttan solma efekti (fade) */
            mask-image: linear-gradient(transparent, black 30%, black 70%, transparent);
            -webkit-mask-image: linear-gradient(transparent, black 30%, black 70%, transparent);
        }
        .lyrics-wrapper {
            position: absolute;
            top: 50%;
            width: 100%;
            transition: transform 0.5s ease-out;
        }
        .lyric-line {
            font-size: 1.3rem;
            padding: 12px 0;
            color: #555;
            transition: all 0.3s ease;
            min-height: 35px;
            margin: 0;
        }
        .lyric-line.active {
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        audio {
            margin-top: 30px;
            width: 80%;
            max-width: 400px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="header-text">durum bu sarkı sana gelsin</div>

    <div class="album-art"></div>
    
    <div class="song-info">
        <h1 class="song-title">Yerin Görsənir</h1>
        <h2 class="artist-name">Namiq Qasımov</h2>
    </div>

    <div class="lyrics-container">
        <div class="lyrics-wrapper" id="lyricsWrapper">
            </div>
    </div>

    <audio id="audioPlayer" controls>
        <source src="sarki.mp3" type="audio/mpeg">
        Tarayıcınız müzik çaları desteklemiyor.
    </audio>

    <script>
        // ŞARKI SÖZLERİ VE ZAMANLAMALARI (Saniye cinsinden)
        // Şarkıyı dinleyerek saniyeleri ve sözleri buraya girmelisin.
        const lyricsData = [
            { time: 0, text: "(Müzik)" },
            { time: 8, text: "Bu kısma şarkının ilk cümlesini yaz..." },
            { time: 13, text: "Buraya ikinci cümleyi yaz..." },
            { time: 18, text: "time kısmındaki sayılar saniyeyi ifade eder." },
            { time: 24, text: "Sözleri bu şekilde çoğaltarak aşağı doğru inebilirsin." }
        ];

        const audio = document.getElementById('audioPlayer');
        const lyricsWrapper = document.getElementById('lyricsWrapper');
        let currentLineIndex = -1;

        // Sözleri HTML içine aktarma
        lyricsData.forEach((line, index) => {
            const div = document.createElement('div');
            div.className = 'lyric-line';
            div.id = `line-${index}`;
            div.innerText = line.text;
            lyricsWrapper.appendChild(div);
        });

        // Müzik çaldıkça sözleri takip etme ve kaydırma
        audio.addEventListener('timeupdate', () => {
            const currentTime = audio.currentTime;
            
            let activeIndex = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            if (activeIndex !== currentLineIndex && activeIndex !== -1) {
                if (currentLineIndex !== -1) {
                    const prevLine = document.getElementById(`line-${currentLineIndex}`);
                    if(prevLine) prevLine.classList.remove('active');
                }
                
                const currentLine = document.getElementById(`line-${activeIndex}`);
                if(currentLine) currentLine.classList.add('active');
                currentLineIndex = activeIndex;

                // Satır kaydırma animasyonu (satır yüksekliğine göre ayarlandı)
                const lineHeight = 60; 
                const translateY = -(activeIndex * lineHeight);
                lyricsWrapper.style.transform = `translateY(${translateY}px)`;
            }
        });
    </script>
</body>
</html>
