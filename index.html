<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yerin Görsənir - Namiq Qasımov</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: #F06292;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-wrapper {
            display: flex;
            flex-direction: row;
            gap: 40px;
            width: 100%;
            max-width: 900px;
            background: linear-gradient(180deg, #2a2a2a 0%, #121212 100%);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.8);
        }

        .player-section {
            width: 350px;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #b3b3b3;
            margin-bottom: 20px;
        }

        .album-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #282828;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
            background-image: url('duru.png'); 
            background-size: cover;
            background-position: center;
        }

        .song-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .song-info h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .song-info h2 {
            font-size: 1rem;
            font-weight: 500;
            color: #b3b3b3;
        }

        .like-icon {
            color: #1db954;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .custom-player {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: #b3b3b3;
            font-weight: 500;
        }

        .progress-bar {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #4d4d4d;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            position: relative;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-container:hover .progress-bar::-webkit-slider-thumb {
            opacity: 1;
        }

        .progress-bar::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 5px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .control-btn:hover {
            color: #ffffff;
        }

        .play-pause-btn {
            background: #ffffff;
            color: #000000;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .play-pause-btn:hover {
            transform: scale(1.05);
            background: #1db954; 
            color: #ffffff;
        }

        .lyrics-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: rgba(40, 40, 40, 0.4); 
            border-radius: 12px;
            padding: 25px;
            height: 500px;
        }

        .lyrics-header {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ffffff;
            flex-shrink: 0;
        }

        .lyrics-scroll-area {
            flex: 1;
            overflow: hidden; 
            position: relative;
        }

        #lyricsWrapper {
            position: absolute;
            top: 50%; 
            width: 100%;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
            transform: translateY(0);
        }

        .lyric-line {
            font-size: 1.4rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.3); 
            margin-bottom: 20px;
            line-height: 1.4;
            transition: all 0.3s ease;
            text-align: left;
            cursor: default;
        }

        .lyric-line.active {
            color: #ffffff;
            font-size: 1.8rem; 
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .main-wrapper {
                flex-direction: column;
                align-items: center;
                padding: 20px;
            }
            .player-section, .lyrics-section {
                width: 100%;
                max-width: 350px;
            }
            .lyrics-section {
                height: 400px;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="player-section">
            <div class="top-bar">Şu an Çalınan</div>
            <div class="album-cover"></div>
            
            <div class="song-details">
                <div class="song-info">
                    <h1>Yerin Görsənir</h1>
                    <h2>Namiq Qasımov</h2>
                </div>
                <div class="like-icon">♥</div>
            </div>

            <audio id="audioPlayer" src="sarki.mp3"></audio>

            <div class="custom-player">
                <div class="progress-container">
                    <span id="currentTime">0:00</span>
                    <input type="range" class="progress-bar" id="progressBar" value="0" step="0.1">
                    <span id="totalTime">0:00</span>
                </div>
                <div class="controls">
                    <button class="control-btn">🔀</button>
                    <button class="control-btn" id="prevBtn">⏮</button>
                    <button class="play-pause-btn" id="playPauseBtn">▶</button>
                    <button class="control-btn" id="nextBtn">⏭</button>
                    <button class="control-btn">🔁</button>
                </div>
            </div>
        </div>

        <div class="lyrics-section">
            <div class="lyrics-header">Sözler</div>
            <div class="lyrics-scroll-area">
                <div id="lyricsWrapper">
                </div>
            </div>
        </div>
    </div>

    <script>
        // İŞTE BURASI: Altyazıları 1 saniye geriye aldık (1 saniye daha ERKEN gelecek).
        // Eğer geç gelmesini istersen 1 yerine -1 yapabilirsin.
        const zamanKaymasi = 4; 

        const lyricsData = [
            { time: 0.0, text: "♪ (Müzik)" },
            { time: 21.5, text: "Bu gecə sərxoşam" },
            { time: 24.8, text: "Düşünürəm səni" },
            { time: 28.0, text: "Sənə vurulmuşam" },
            { time: 31.0, text: "Qınama sən məni" },
            { time: 34.5, text: "Belə olur sevəndə adam kövrəlir" },
            { time: 38.2, text: "Qarışır hisslər, dumanlar gəlir" },
            { time: 42.5, text: "Durmadan sənin sağlığına tək içirəm" },
            { time: 49.0, text: "Yerin görsənir" },
            { time: 52.5, text: "Ürəyim istədi" },
            { time: 55.8, text: "Bəlkə gələsən yanıma" },
            { time: 59.5, text: "Yerin görsənir" },
            { time: 63.0, text: "Heç kəsi dinləmədən" },
            { time: 66.0, text: "Gəl görüşək gizlicə" },
            { time: 69.0, text: "Dünyanın ən dəli sərxoşu kimi" },
            { time: 72.5, text: "Süzüm nəfəsini" },
            { time: 74.5, text: "İçim bu gecə" },
            { time: 77.5, text: "Heç kəsi dinləmədən" },
            { time: 80.5, text: "Gəl görüşək gizlicə" },
            { time: 84.0, text: "Dünyanın ən dəli sərxoşu kimi" },
            { time: 87.5, text: "Süzüm nəfəsini" },
            { time: 89.5, text: "İçim bu gecə" },
            { time: 94.0, text: "♪ (Müzik)" },
            { time: 122.0, text: "Belə olur sevəndə adam kövrəlir" },
            { time: 126.0, text: "Qarışır hisslər, dumanlar gəlir" },
            { time: 130.0, text: "Durmadan sənin sağlığına tək içirəm" },
            { time: 137.0, text: "Yerin görsənir" },
            { time: 140.0, text: "Ürəyim istədi" },
            { time: 143.0, text: "Bəlkə gələsən yanıma" },
            { time: 147.0, text: "Yerin görsənir" },
            { time: 150.5, text: "Heç kəsi dinləmədən" },
            { time: 153.5, text: "Gəl görüşək gizlicə" },
            { time: 156.5, text: "Dünyanın ən dəli sərxoşu kimi" },
            { time: 160.0, text: "Süzüm nəfəsini" },
            { time: 162.0, text: "İçim bu gecə" },
            { time: 165.0, text: "Heç kəsi dinləmədən" },
            { time: 168.0, text: "Gəl görüşək gizlicə" },
            { time: 171.5, text: "Dünyanın ən dəli sərxoşu kimi" },
            { time: 175.0, text: "Süzüm nəfəsini" },
            { time: 177.0, text: "İçim bu gecə" },
            { time: 182.0, text: "♪ (Müzik bitişi)" }
        ];

        const audio = document.getElementById('audioPlayer');
        const lyricsWrapper = document.getElementById('lyricsWrapper');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        
        let currentLineIndex = -1;

        lyricsData.forEach((line, index) => {
            const div = document.createElement('div');
            div.className = 'lyric-line';
            div.id = `line-${index}`;
            div.innerText = line.text;
            lyricsWrapper.appendChild(div);
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        audio.addEventListener('loadedmetadata', () => {
            progressBar.max = audio.duration;
            totalTimeEl.innerText = formatTime(audio.duration);
        });

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playPauseBtn.innerText = "⏸";
            } else {
                audio.pause();
                playPauseBtn.innerText = "▶";
            }
        });

        progressBar.addEventListener('input', () => {
            audio.currentTime = progressBar.value;
        });

        audio.addEventListener('timeupdate', () => {
            const currentTime = audio.currentTime;
            
            progressBar.value = currentTime;
            currentTimeEl.innerText = formatTime(currentTime);

            const progressPercent = (currentTime / audio.duration) * 100;
            progressBar.style.background = `linear-gradient(to right, #1db954 ${progressPercent}%, #4d4d4d ${progressPercent}%)`;
            
            // Zaman kaymasını sözlerin akışına ekliyoruz
            const adjustedTime = currentTime + zamanKaymasi;

            let activeIndex = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (adjustedTime >= lyricsData[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            if (activeIndex !== currentLineIndex && activeIndex !== -1) {
                if (currentLineIndex !== -1) {
                    const prevLine = document.getElementById(`line-${currentLineIndex}`);
                    if(prevLine) prevLine.classList.remove('active');
                }
                
                const currentLine = document.getElementById(`line-${activeIndex}`);
                if(currentLine) {
                    currentLine.classList.add('active');
                    
                    const offset = -(currentLine.offsetTop) - (currentLine.clientHeight / 2);
                    lyricsWrapper.style.transform = `translateY(${offset}px)`;
                }
                currentLineIndex = activeIndex;
            }
        });

        audio.addEventListener('ended', () => {
            playPauseBtn.innerText = "▶";
            progressBar.value = 0;
            progressBar.style.background = `#4d4d4d`;
            currentTimeEl.innerText = "0:00";
        });
    </script>
</body>
</html>
